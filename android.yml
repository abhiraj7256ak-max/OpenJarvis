
name: My Jaan Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set App Name
        run: |
          python3 - <<'PY'
          import json
          p = "frontend/src-tauri/tauri.conf.json"
          with open(p) as f:
              c = json.load(f)
          c["productName"] = "My Jaan"
          c["identifier"] = "com.myjaan.app"
          for w in c.get("app", {}).get("windows", []):
              w["title"] = "My Jaan"
          with open(p, "w") as f:
              json.dump(c, f, indent=2)
          PY

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Initialize Android
        run: npx tauri android init --ci
        working-directory: frontend

      - name: Build APK
        run: npx tauri android build --apk
        working-directory: frontend

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Jaan-APK
          path: frontend/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          
